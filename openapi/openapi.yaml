openapi: 3.0.3
info:
  title: Order Service API
  description: Beispiel-Microservice der Software Factory. Dieser Vertrag ist die Quelle der Wahrheit.
  version: 0.1.0

servers:
  - url: http://localhost:8080

tags:
  - name: orders
    description: Bestellungen anlegen und abrufen
  - name: products
    description: Produktkatalog (lesend)

paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Bestellungen auflisten, optional nach Status gefiltert
      parameters:
        - name: status
          in: query
          required: false
          description: Nur Bestellungen mit diesem Status liefern
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: sort
          in: query
          required: false
          description: Sortierung nach Anlegedatum; ohne Angabe bleibt die Reihenfolge des Anlegens
          schema:
            $ref: "#/components/schemas/OrderSort"
      responses:
        "200":
          description: Liste der Bestellungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          description: Ungültiger Wert für status oder sort
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      tags: [orders]
      operationId: createOrder
      summary: Neue Bestellung anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Bestellung angelegt
          headers:
            Location:
              description: URL der neuen Bestellung
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Ungültige Anfrage oder unbekannte Artikelnummer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Eine Bestellung abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Die Bestellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Bestellung nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Eine Bestellung stornieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Die stornierte Bestellung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Bestellung nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Bestellung ist bereits storniert
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Alle Produkte des Katalogs auflisten, nach sku aufsteigend
      responses:
        "200":
          description: Liste der Produkte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{sku}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Ein Produkt abrufen
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Das Produkt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Produkt nicht gefunden
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  schemas:
    Product:
      type: object
      required: [sku, name, priceCents]
      properties:
        sku:
          type: string
        name:
          type: string
        priceCents:
          type: integer
          format: int32
          minimum: 0

    OrderItem:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000

    CreateOrderRequest:
      type: object
      required: [customerId, items]
      properties:
        customerId:
          type: string
          minLength: 1
          maxLength: 64
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderStatus:
      type: string
      enum: [CREATED, CANCELLED]

    OrderSort:
      type: string
      enum: [createdAt_asc, createdAt_desc]

    Order:
      type: object
      required: [id, customerId, items, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

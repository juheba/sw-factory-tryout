<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order-API (OpenAPI)</title>
  <link rel="icon" type="image/png" href="ui/favicon-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="ui/swagger-ui.css">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; background: #fff; }
    .navbar { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; padding: 12px 20px;
      font: 14px/1.4 system-ui, sans-serif; background: #f0f2f5; border-bottom: 1px solid #d0d7de; color: #1f2328; }
    .navbar strong { margin-right: auto; font-size: 16px; }
    .navbar a { color: #0550ae; text-decoration: none; }
    .navbar a:hover { text-decoration: underline; }
    .navbar small { color: #57606a; }
    /* Swagger UI hat keinen eigenen Dunkelmodus: Farben invertieren, Code-Beispiele wieder zurückdrehen. */
    @media (prefers-color-scheme: dark) {
      body { background: #121417; }
      .navbar { background: #1c2128; border-color: #30363d; color: #e6edf3; }
      .navbar a { color: #79c0ff; }
      .navbar small { color: #9198a1; }
      #swagger-ui { filter: invert(90%) hue-rotate(180deg); }
      #swagger-ui .microlight, #swagger-ui img { filter: invert(100%) hue-rotate(180deg); }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Weiterführende Links">
    <strong>Order-API</strong>
    <a href="openapi.yaml">openapi.yaml herunterladen</a>
    <a href="https://github.com/juheba/sw-factory-tryout/blob/main/docs/architecture.md">Architektur</a>
    <a href="https://github.com/juheba/sw-factory-tryout/blob/main/docs/process.md">Prozess</a>
    <a href="https://github.com/juheba/sw-factory-tryout/blob/main/docs/betrieb.md">Betrieb</a>
    <a href="https://github.com/juheba/sw-factory-tryout/tree/main/docs/adr">Entscheidungen (ADR)</a>
    <a href="https://github.com/juheba/sw-factory-tryout">Repository</a>
    <small>Swagger UI @@SWAGGER_UI_TAG@@, nur lesend</small>
  </nav>
  <div id="swagger-ui"></div>
  <script src="ui/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 1,
      // Es gibt keinen erreichbaren Service: „Try it out“ ist abgeschaltet.
      supportedSubmitMethods: [],
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>

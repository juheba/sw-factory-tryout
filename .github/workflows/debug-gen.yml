# TEMPORÄR: gibt den generierten Dart-Client als Annotation aus. Wird wieder entfernt.
name: debug-gen
on:
  push:
    branches: [agent/8-cancel-order]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :frontend:openApiGenerate
      - name: Dump
        run: |
          d=frontend/packages/order_api/lib
          emit() {
            msg=$(sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')
            echo "::notice title=$1::${msg}"
          }
          grep -v '^\s*//' "$d/model/order_status.dart" | emit order_status
          grep -nE 'status|OrderStatus' "$d/model/order.dart" | head -40 | emit order_status_usage
          grep -nE 'cancelOrder' "$d/api/orders_api.dart" | emit cancel_signature

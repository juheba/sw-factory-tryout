name: API-Doku

# Veröffentlicht den OpenAPI-Vertrag als Webseite (Swagger UI) auf GitHub Pages.
# Die Seite wird bei jedem Lauf aus openapi/openapi.yaml erzeugt und nicht eingecheckt (site/build.sh).
# Issue #96, Roadmap X3.

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Standard: keine Rechte. Die Jobs vergeben sich unten nur, was sie brauchen.
permissions: {}

# Ein Deploy zur Zeit; ein laufender wird nicht abgebrochen, ein neuer wartet.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Prüft die Spec und baut die Seite. Ein Fehler hier bricht den Lauf ab, die bisherige Seite bleibt bestehen.
      - name: Seite bauen
        run: ./site/build.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Das Environment legt GitHub beim ersten Deploy selbst an. Deployments dürfen nur von main kommen.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
